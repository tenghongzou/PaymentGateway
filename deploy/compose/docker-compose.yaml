# PaymentGateway local development stack.
#
#   make compose-up                      # build + start everything
#   COMPOSE_PROFILES=tools make compose-up   # + kafka-ui + vault
#   make compose-logs S=payment-service
#
# Ports/DB names follow docs/01-architecture.md. Application env vars all use the PG_ prefix.
# NOTE: ./postgres/init.sql (creates the per-service databases/roles) is owned by the DBA and is
#       mounted into /docker-entrypoint-initdb.d/ - it only runs on first start of an empty volume.
#       Roles from init.sql: <svc>_owner (DDL, used locally because PG_AUTO_MIGRATE=true) and <svc>_app (DML only,
#       what the service uses in staging/production). Databases: pg_merchant pg_payment pg_ledger pg_webhook pg_recon.
name: paymentgateway

# ---------------------------------------------------------------------------
# Shared fragments
# ---------------------------------------------------------------------------
x-app-env: &app-env
  PG_ENV: dev
  PG_LOG_LEVEL: ${PG_LOG_LEVEL:-debug}
  PG_AUTO_MIGRATE: "true"
  PG_MIGRATIONS_DIR: /migrations
  PG_VALKEY_ADDR: valkey:6379
  PG_KAFKA_BROKERS: kafka:9092
  PG_OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
  PG_OTEL_EXPORTER_OTLP_INSECURE: "true"
  PG_MERCHANT_SERVICE_ADDR: merchant-service:9001
  PG_PAYMENT_SERVICE_ADDR: payment-service:9002
  PG_LEDGER_SERVICE_ADDR: ledger-service:9003
  PG_WEBHOOK_SERVICE_ADDR: webhook-service:9004
  PG_RECONCILIATION_SERVICE_ADDR: reconciliation-service:9005
  PG_PROVIDER_ADDRS: mock=provider-mock:9101,stripe=provider-stripe:9102

x-app-common: &app-common
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - pg
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Infra dependencies shared by services that own a database
x-depends-infra: &depends-infra
  postgres:
    condition: service_healthy
  valkey:
    condition: service_healthy
  kafka:
    condition: service_healthy
  otel-collector:
    condition: service_started

services:
  # =========================================================================
  # Infrastructure
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: pg-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=200
      - -c
      - wal_level=logical
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Provided by the DBA: creates pg_merchant, pg_payment, pg_ledger, pg_webhook, pg_recon + matching roles.
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - pg

  valkey:
    image: valkey/valkey:8-alpine
    container_name: pg-valkey
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - pg

  kafka:
    # Single-node KRaft (no ZooKeeper). Internal listener kafka:9092, host listener localhost:29092.
    image: apache/kafka:3.8.0
    container_name: pg-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-pg-local-kraft-cluster-01}
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - pg

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: pg-kafka-ui
    profiles: ["tools"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - pg

  vault:
    image: hashicorp/vault:1.18
    container_name: pg-vault
    profiles: ["tools"]
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "${VAULT_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - pg

  # =========================================================================
  # Observability
  # =========================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: pg-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"   # OTLP gRPC
      - "${OTLP_HTTP_PORT:-4318}:4318"   # OTLP HTTP
      - "8889:8889"                      # Prometheus exporter (scraped by prometheus)
      - "13133:13133"                    # health_check extension
    depends_on:
      jaeger:
        condition: service_started
    networks:
      - pg

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: pg-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
      MEMORY_MAX_TRACES: 50000
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    networks:
      - pg

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: pg-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    volumes:
      - ../otel/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ../otel/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      otel-collector:
        condition: service_started
    networks:
      - pg

  grafana:
    image: grafana/grafana:11.3.0
    container_name: pg-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ../otel/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../otel/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started
    networks:
      - pg

  # =========================================================================
  # Application services (one image per service, built from the repo root)
  # =========================================================================
  api-gateway:
    <<: *app-common
    image: paymentgateway/api-gateway:${VERSION:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: api-gateway
        VERSION: ${VERSION:-dev}
    environment:
      <<: *app-env
      PG_SERVICE_NAME: api-gateway
      PG_HTTP_ADDR: ":8080"
      PG_AUTO_MIGRATE: "false"
      PG_RATE_LIMIT_RPS: ${PG_RATE_LIMIT_RPS:-100}
      PG_IDEMPOTENCY_TTL: 24h
      # 開發模式憑證：PG_ENV=dev 且三者皆有值時，gateway 的 Auth middleware 不呼叫 merchant-service，
      # 直接以這組 API key / signing secret / merchant_id 驗證（merchant-service 完成後可移除）。
      PG_DEV_API_KEY: ${PG_DEV_API_KEY:-pk_test_dev_0000000000000000}
      PG_DEV_SIGNING_SECRET: ${PG_DEV_SIGNING_SECRET:-sk_test_dev_secret_change_me}
      PG_DEV_MERCHANT_ID: ${PG_DEV_MERCHANT_ID:-0190a1b2-c3d4-7e5f-8a9b-000000000001}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      valkey:
        condition: service_healthy
      otel-collector:
        condition: service_started
      merchant-service:
        condition: service_started
      payment-service:
        condition: service_started
      ledger-service:
        condition: service_started
      webhook-service:
        condition: service_started
      reconciliation-service:
        condition: service_started

  merchant-service:
    <<: *app-common
    image: paymentgateway/merchant-service:${VERSION:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: merchant-service
        VERSION: ${VERSION:-dev}
    environment:
      <<: *app-env
      PG_SERVICE_NAME: merchant-service
      PG_GRPC_ADDR: ":9001"
      PG_HTTP_ADDR: ":8081"
      PG_DATABASE_URL: postgres://merchant_owner:${PG_DB_PASSWORD_MERCHANT:-merchant_owner}@postgres:5432/pg_merchant?sslmode=disable
    ports:
      - "9001:9001"
      - "18001:8081"
    depends_on: *depends-infra

  payment-service:
    <<: *app-common
    image: paymentgateway/payment-service:${VERSION:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: payment-service
        VERSION: ${VERSION:-dev}
    environment:
      <<: *app-env
      PG_SERVICE_NAME: payment-service
      PG_GRPC_ADDR: ":9002"
      PG_HTTP_ADDR: ":8081"
      PG_DATABASE_URL: postgres://payment_owner:${PG_DB_PASSWORD_PAYMENT:-payment_owner}@postgres:5432/pg_payment?sslmode=disable
      PG_PROVIDER_TIMEOUT: 10s
      PG_PROVIDER_FAILOVER_MAX_ATTEMPTS: "2"
    ports:
      - "9002:9002"
      - "18002:8081"
    depends_on:
      <<: *depends-infra
      provider-mock:
        condition: service_started
      provider-stripe:
        condition: service_started

  ledger-service:
    <<: *app-common
    image: paymentgateway/ledger-service:${VERSION:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: ledger-service
        VERSION: ${VERSION:-dev}
    environment:
      <<: *app-env
      PG_SERVICE_NAME: ledger-service
      PG_GRPC_ADDR: ":9003"
      PG_HTTP_ADDR: ":8081"
      PG_DATABASE_URL: postgres://ledger_owner:${PG_DB_PASSWORD_LEDGER:-ledger_owner}@postgres:5432/pg_ledger?sslmode=disable
      PG_KAFKA_CONSUMER_GROUP: ledger-service
    ports:
      - "9003:9003"
      - "18003:8081"
    depends_on: *depends-infra

  webhook-service:
    <<: *app-common
    image: paymentgateway/webhook-service:${VERSION:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: webhook-service
        VERSION: ${VERSION:-dev}
    environment:
      <<: *app-env
      PG_SERVICE_NAME: webhook-service
      PG_GRPC_ADDR: ":9004"
      PG_HTTP_ADDR: ":8081"
      PG_DATABASE_URL: postgres://webhook_owner:${PG_DB_PASSWORD_WEBHOOK:-webhook_owner}@postgres:5432/pg_webhook?sslmode=disable
      PG_KAFKA_CONSUMER_GROUP: webhook-service
      PG_WEBHOOK_MAX_ATTEMPTS: "10"
      PG_WEBHOOK_TIMEOUT: 10s
    ports:
      - "9004:9004"
      - "18004:8081"
    depends_on: *depends-infra

  reconciliation-service:
    <<: *app-common
    image: paymentgateway/reconciliation-service:${VERSION:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: reconciliation-service
        VERSION: ${VERSION:-dev}
    environment:
      <<: *app-env
      PG_SERVICE_NAME: reconciliation-service
      PG_GRPC_ADDR: ":9005"
      PG_HTTP_ADDR: ":8081"
      PG_DATABASE_URL: postgres://recon_owner:${PG_DB_PASSWORD_RECON:-recon_owner}@postgres:5432/pg_recon?sslmode=disable
      PG_KAFKA_CONSUMER_GROUP: reconciliation-service
    ports:
      - "9005:9005"
      - "18005:8081"
    depends_on: *depends-infra

  provider-mock:
    <<: *app-common
    image: paymentgateway/provider-mock:${VERSION:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: provider-mock
        VERSION: ${VERSION:-dev}
    environment:
      <<: *app-env
      PG_SERVICE_NAME: provider-mock
      PG_GRPC_ADDR: ":9101"
      PG_HTTP_ADDR: ":8081"
      PG_AUTO_MIGRATE: "false"
      PG_MOCK_DEFAULT_LATENCY: ${PG_MOCK_DEFAULT_LATENCY:-50ms}
      PG_MOCK_FAILURE_RATE: ${PG_MOCK_FAILURE_RATE:-0}
    ports:
      - "9101:9101"
      - "18101:8081"
    depends_on:
      otel-collector:
        condition: service_started

  provider-stripe:
    <<: *app-common
    image: paymentgateway/provider-stripe:${VERSION:-dev}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        SERVICE: provider-stripe
        VERSION: ${VERSION:-dev}
    environment:
      <<: *app-env
      PG_SERVICE_NAME: provider-stripe
      PG_GRPC_ADDR: ":9102"
      PG_HTTP_ADDR: ":8081"
      PG_AUTO_MIGRATE: "false"
      PG_STRIPE_API_KEY: ${PG_STRIPE_API_KEY:-sk_test_placeholder}
      PG_STRIPE_WEBHOOK_SECRET: ${PG_STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      PG_STRIPE_API_BASE_URL: ${PG_STRIPE_API_BASE_URL:-https://api.stripe.com}
    ports:
      - "9102:9102"
      - "18102:8081"
    depends_on:
      otel-collector:
        condition: service_started

networks:
  pg:
    name: paymentgateway
    driver: bridge

volumes:
  pgdata:
  kafkadata:
  promdata:
