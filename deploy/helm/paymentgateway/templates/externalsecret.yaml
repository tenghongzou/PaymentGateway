{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
{{- range $name, $raw := .Values.services }}
{{- $svc := include "pg.mergeSvc" (dict "root" $ "raw" $raw) | fromYaml }}
{{- if and $svc.enabled $svc.externalSecret.enabled }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
---
# Pulls secrets from Vault (via External Secrets Operator) into Secret "{{ include "pg.secretName" $ctx }}".
# Keys stored in Vault must already be named like the env vars (PG_DATABASE_URL, PG_STRIPE_API_KEY, ...).
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "pg.fullname" $ctx }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "pg.labels" $ctx | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ include "pg.secretName" $ctx }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          {{- include "pg.labels" $ctx | nindent 10 }}
  dataFrom:
    # shared secrets first, service-specific last (later entries win on key collision)
    - extract:
        key: {{ printf "%s/%s/%s" $es.pathPrefix $.Values.global.env $es.commonKey | quote }}
    - extract:
        key: {{ printf "%s/%s/%s" $es.pathPrefix $.Values.global.env $name | quote }}
  {{- with $svc.externalSecret.extraData }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
