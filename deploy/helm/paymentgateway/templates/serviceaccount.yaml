{{- range $name, $raw := .Values.services }}
{{- $svc := include "pg.mergeSvc" (dict "root" $ "raw" $raw) | fromYaml }}
{{- if and $svc.enabled $svc.serviceAccount.create }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pg.serviceAccountName" $ctx }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "pg.labels" $ctx | nindent 4 }}
  {{- with $svc.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
