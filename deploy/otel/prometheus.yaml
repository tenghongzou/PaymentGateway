# Prometheus configuration for the local compose stack.
global:
  scrape_interval: 10s
  evaluation_interval: 15s
  external_labels:
    env: dev
    cluster: compose

rule_files:
  - /etc/prometheus/alerts.yaml

# No Alertmanager locally; alerts are visible in the Prometheus UI (/alerts).
alerting:
  alertmanagers: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Application metrics flow: service SDK -> OTLP -> otel-collector -> prometheus exporter (:8889)
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          source: otel

  # Collector self-telemetry
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

  # Direct /metrics scrape of every service (health/metrics HTTP port; gateway uses 8080).
  # Useful when a service also exposes a Prometheus handler; targets that 404 are simply "down".
  - job_name: pg-services
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8080"]
        labels: { service: api-gateway }
      - targets: ["merchant-service:8081"]
        labels: { service: merchant-service }
      - targets: ["payment-service:8081"]
        labels: { service: payment-service }
      - targets: ["ledger-service:8081"]
        labels: { service: ledger-service }
      - targets: ["webhook-service:8081"]
        labels: { service: webhook-service }
      - targets: ["reconciliation-service:8081"]
        labels: { service: reconciliation-service }
      - targets: ["provider-mock:8081"]
        labels: { service: provider-mock }
      - targets: ["provider-stripe:8081"]
        labels: { service: provider-stripe }
