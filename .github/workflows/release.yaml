name: Release

# Trunk-based: every semver tag on main (vX.Y.Z or vX.Y.Z-rc.N) produces
#   1. multi-arch images ghcr.io/<owner>/paymentgateway/<service>:X.Y.Z (+ X.Y, latest for non-prerelease)
#   2. a packaged Helm chart pushed to oci://ghcr.io/<owner>/paymentgateway/charts
#   3. a GitHub Release with generated notes, chart tgz and image digests
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  meta:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  images:
    name: image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [meta]
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write     # cosign keyless
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - merchant-service
          - payment-service
          - ledger-service
          - webhook-service
          - reconciliation-service
          - provider-mock
          - provider-stripe
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/paymentgateway/${{ matrix.service }}
    outputs:
      digest-api-gateway: ${{ steps.out.outputs.digest-api-gateway }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.meta.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.meta.outputs.prerelease == 'false' }}
            type=sha,prefix=sha-,format=short
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: cosign sign (keyless)
        env:
          COSIGN_YES: "true"
        run: cosign sign "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: trivy image scan (gate)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: record digest
        id: out
        run: |
          mkdir -p digests
          echo "${IMAGE}@${{ steps.build.outputs.digest }}" > "digests/${{ matrix.service }}.txt"
          echo "digest-${{ matrix.service }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service }}
          path: digests/${{ matrix.service }}.txt
          retention-days: 30

  chart:
    name: helm chart
    runs-on: ubuntu-latest
    needs: [meta, images]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: lint
        run: |
          CH=deploy/helm/paymentgateway
          helm lint $CH --strict -f $CH/values-production.yaml
      - name: package
        run: |
          mkdir -p dist
          helm package deploy/helm/paymentgateway \
            --version "${{ needs.meta.outputs.version }}" \
            --app-version "${{ github.ref_name }}" \
            --destination dist
          ls -l dist
      - name: push to OCI registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/paymentgateway-${{ needs.meta.outputs.version }}.tgz "oci://ghcr.io/${{ github.repository_owner }}/paymentgateway/charts"
      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz
          retention-days: 30

  release:
    name: github release
    runs-on: ubuntu-latest
    needs: [meta, images, chart]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: assemble release assets
        run: |
          mkdir -p release
          cp artifacts/helm-chart/*.tgz release/
          {
            echo "## Images"
            echo
            echo '| service | digest |'
            echo '|---|---|'
            for f in artifacts/digest-*/*.txt; do
              svc=$(basename "$f" .txt)
              echo "| $svc | \`$(cat "$f")\` |"
            done
            echo
            echo "## Deploy"
            echo
            echo '```bash'
            echo "helm upgrade --install paymentgateway oci://ghcr.io/${{ github.repository_owner }}/paymentgateway/charts/paymentgateway \\"
            echo "  --version ${{ needs.meta.outputs.version }} -n payments \\"
            echo "  -f values-production.yaml --set global.imageTag=${{ github.ref_name }}"
            echo '```'
          } > release/IMAGES.md
          cat release/IMAGES.md
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body_path: release/IMAGES.md
          files: |
            release/*.tgz
          fail_on_unmatched_files: true
