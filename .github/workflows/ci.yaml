name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/paymentgateway
  GOTOOLCHAIN: auto
  GOFLAGS: -mod=readonly

jobs:
  # ---------------------------------------------------------------------------
  lint:
    name: lint (golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || { echo "::error::go.mod/go.sum not tidy - run make tidy"; exit 1; }
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=10m
          only-new-issues: ${{ github.event_name == 'pull_request' }}

  # ---------------------------------------------------------------------------
  proto:
    name: proto (buf lint / breaking / generated code up-to-date)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: buf lint
        run: buf lint
      - name: buf breaking (against main)
        if: github.event_name == 'pull_request'
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main"
      - name: install protoc plugins
        run: |
          mkdir -p bin
          GOBIN=$PWD/bin go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          GOBIN=$PWD/bin go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - name: regenerate and verify api/gen is committed
        run: |
          make proto
          git add -N api/gen
          if ! git diff --exit-code -- api/gen; then
            echo "::error::api/gen is stale - run 'make proto' and commit the result"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  test:
    name: test (unit, race, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 -timeout 10m -coverprofile=coverage.out -covermode=atomic ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -n 1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage.out
          retention-days: 14

  # ---------------------------------------------------------------------------
  integration:
    name: integration (-tags integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # Tests may either use these shared services or spin up their own via testcontainers-go
      # (docker is available on ubuntu runners). Kafka is always provided by testcontainers.
      PG_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      PG_TEST_REDIS_ADDR: localhost:6379
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -tags integration
        run: go test -race -count=1 -timeout 20m -tags integration -coverprofile=coverage-integration.out -covermode=atomic ./...
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage-integration.out
          retention-days: 14

  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - merchant-service
          - payment-service
          - ledger-service
          - webhook-service
          - reconciliation-service
          - provider-mock
          - provider-stripe
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/paymentgateway/${{ matrix.service }}
      PUSH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: login to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=commit-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=paymentgateway/${{ matrix.service }}
            org.opencontainers.image.vendor=PaymentGateway
      - name: derive version
        id: ver
        run: echo "version=$(git describe --tags --always --dirty 2>/dev/null || echo ${GITHUB_SHA::7})" >> "$GITHUB_OUTPUT"
      - name: build (and push on main/tag)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ steps.ver.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
          platforms: ${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          provenance: ${{ env.PUSH == 'true' }}
          sbom: ${{ env.PUSH == 'true' }}
      - name: trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:commit-${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: upload trivy sarif
        if: always() && env.PUSH == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

  # ---------------------------------------------------------------------------
  security:
    name: security (govulncheck / gitleaks / trivy fs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"
      - name: trivy fs (vuln + misconfig + secrets on Dockerfile/helm/compose)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ---------------------------------------------------------------------------
  helm:
    name: helm (lint + template)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: |
          set -e
          CH=deploy/helm/paymentgateway
          helm lint $CH --strict
          helm lint $CH --strict -f $CH/values-staging.yaml
          helm lint $CH --strict -f $CH/values-production.yaml
      - name: helm template
        run: |
          set -e
          CH=deploy/helm/paymentgateway
          helm template pg $CH --kube-version=1.30.0 -n payments > /tmp/default.yaml
          helm template pg $CH --kube-version=1.30.0 -n payments -f $CH/values-staging.yaml > /tmp/staging.yaml
          helm template pg $CH --kube-version=1.30.0 -n payments -f $CH/values-production.yaml > /tmp/production.yaml
      - name: kubeconform
        uses: docker://ghcr.io/yannh/kubeconform:v0.6.7
        with:
          args: >-
            -strict -summary -ignore-missing-schemas
            -kubernetes-version 1.30.0
            -schema-location default
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            /tmp/default.yaml /tmp/staging.yaml /tmp/production.yaml
      - name: compose config
        run: |
          cd deploy/compose
          test -f postgres/init.sql || { : > postgres/init.sql; created=1; }
          docker compose config -q
          docker compose --profile tools config -q
          [ -z "${created:-}" ] || rm -f postgres/init.sql
